[package]
name = "prism-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Prism command-line interface"

[lib]
name = "prism_cli"
path = "src/lib.rs"

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
prism-model = { path = "../prism-model" }
prism-store = { path = "../prism-store" }
prism-api = { path = "../prism-api" }
prism-bundle = { path = "../prism-bundle" }

[lints]
workspace = true
