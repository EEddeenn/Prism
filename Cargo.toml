[workspace]
resolver = "2"
members = [
    "crates/prism-model",
    "crates/prism-codec",
    "crates/prism-store",
    "crates/prism-plugin-api",
    "crates/prism-graph",
    "crates/prism-semver",
    "crates/prism-resolve",
    "crates/prism-tda",
    "crates/prism-textfmt",
    "crates/prism-plugin-cargo",
    "crates/prism-plugin-npm",
    "crates/prism-plugin-bun",
    "crates/prism-plugin-pnpm",
    "crates/prism-plugin-uv",
    "crates/prism-api",
    "crates/prism-cli",
    "crates/prism-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/prism"
description = "Prism: a local-first dependency topology analysis system"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
# Defense-in-depth: keep integer-overflow checks ON in release so an arithmetic
# bug on untrusted input is a typed failure/panic, not a silent wrap producing a
# wrong analysis result. The hot paths are bounds-checked already; the cost is
# negligible for an analysis tool.
overflow-checks = true
