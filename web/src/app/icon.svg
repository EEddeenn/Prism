  <!-- vertex spectrum: node-match / node-dup / node-gen (harmonized graph-role tints) -->
  <circle cx="24" cy="5" r="3.3" fill="#8fb8ce" />
  <circle cx="43.5" cy="38" r="3.3" fill="#c77fa0" />
