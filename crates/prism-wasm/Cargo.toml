[package]
name = "prism-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WebAssembly bridge for Prism: load a bundle in-memory and dispatch views from the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
prism-model = { path = "../prism-model" }
prism-bundle = { path = "../prism-bundle" }
prism-store = { path = "../prism-store" }
prism-api = { path = "../prism-api" }

# Override the workspace `unsafe_code = "forbid"` — wasm-bindgen-generated
# bindings require unsafe under the hood. Mirrors the planned crates/web
# exemption (this crate is the only non-hermetic Rust crate in the workspace).
[lints.rust]
unsafe_code = "allow"
